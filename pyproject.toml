[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etherglass"
version = "0.1.0"
description = "An evidence-aware RF signal observatory for offline complex I/Q analysis and interference suppression"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [{name = "Nazeeh"}]
dependencies = [
  "numpy>=2.0,<3", "scipy>=1.14,<2", "torch>=2.6,<2.10",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "sigmf>=1.2,<2"
]

[project.optional-dependencies]
research = ["matplotlib>=3.9,<4", "scikit-learn>=1.5,<2", "h5py>=3.12,<4", "sigmf>=1.2,<2"]
test = ["pytest>=8,<9", "httpx>=0.27,<1", "sigmf>=1.2,<2"]

[project.scripts]
etherglass = "etherglass.cli:main"

[project.urls]
Homepage = "https://github.com/nazeeh111/ETHERGLASS"
Issues = "https://github.com/nazeeh111/ETHERGLASS/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
etherglass = ["web/*", "resources/models/*", "resources/models/seed*/*.pt", "resources/examples/*"]
"etherglass._vendor" = ["*.txt", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
