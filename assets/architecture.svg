<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">ETHERGLASS inference and evidence pipeline</title><desc id="desc">Validated complex samples and explicit target priors enter spectral features, a trained gain model and overlap-add reconstruction. The target, residual, abstention and ensemble uncertainty are exported with provenance. Clean references are confined to training and evaluation.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#72776d"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#252c2b}.small{font-size:13px;fill:#62685f}.mono{font-family:monospace;font-size:11px;letter-spacing:1px;fill:#a4472a}.box{fill:#f9f8f3;stroke:#cfcec3}.line{fill:none;stroke:#72776d;marker-end:url(#arrow);stroke-width:1.3}</style></defs>
<rect width="1200" height="500" fill="#eeede6"/>
<text x="40" y="43" class="mono">ETHERGLASS / METHOD OVERVIEW</text>
<text x="40" y="83" font-size="28">A target hypothesis, reconstructed and checked.</text>
<path d="M40 105H1160" stroke="#252c2b"/>
<g transform="translate(40 145)"><rect class="box" width="192" height="119"/><text x="16" y="27" class="mono">01 / OBSERVE</text><text x="16" y="57" font-size="19">Complex I/Q</text><text x="16" y="81" class="small">Format · rate · frequency</text><text x="16" y="101" class="small">Bounds · finite data · hash</text></g>
<path class="line" d="M233 204H259"/>
<g transform="translate(264 145)"><rect class="box" width="192" height="119"/><text x="16" y="27" class="mono">02 / CONDITION</text><text x="16" y="57" font-size="19">Spectral features</text><text x="16" y="81" class="small">Center + symbol-rate prior</text><text x="16" y="101" class="small">Hann · FFT · local contrast</text></g>
<path class="line" d="M457 204H483"/>
<g transform="translate(488 145)"><rect width="192" height="119" fill="#474b97"/><text x="16" y="27" font-family="monospace" font-size="11" letter-spacing="1" style="fill:#f9f8f3">03 / ESTIMATE</text><text x="16" y="57" font-size="19" style="fill:#f9f8f3">Learned gain mask</text><text x="16" y="81" font-size="13" style="fill:#f9f8f3">6,865 trained parameters</text><text x="16" y="101" font-size="13" style="fill:#f9f8f3">Analytic target support</text></g>
<path class="line" d="M681 204H707"/>
<g transform="translate(712 145)"><rect class="box" width="192" height="119"/><text x="16" y="27" class="mono">04 / RECONSTRUCT</text><text x="16" y="57" font-size="19">Target + residual</text><text x="16" y="81" class="small">Inverse FFT · overlap-add</text><text x="16" y="101" class="small">Residual = input − estimate</text></g>
<path class="line" d="M905 204H931"/>
<g transform="translate(936 145)"><rect class="box" width="224" height="119"/><text x="16" y="27" class="mono">05 / VERIFY</text><text x="16" y="57" font-size="19">Source-bound exports</text><text x="16" y="81" class="small">SigMF samples + JSON report</text><text x="16" y="101" class="small">Method · selection · attribution</text></g>
<path class="line" d="M808 265V316"/><path class="line" d="M1048 320V270"/>
<rect x="712" y="321" width="448" height="103" class="box"/>
<text x="731" y="347" class="mono">INDEPENDENT EVIDENCE CHECKS</text><text x="731" y="374" font-size="15">Physical features → known PSK family or unknown</text><text x="731" y="400" class="small">Three training seeds → disagreement + scoped error bound</text>
<rect x="40" y="321" width="640" height="103" fill="#e7e3d6"/>
<text x="58" y="347" class="mono">TRAINING AND EVALUATION ONLY</text><text x="58" y="374" font-size="15">Preserved synthetic target → supervised loss and fidelity metrics</text><text x="58" y="400" class="small">Disjoint records · matched priors · repeated seeds · actual inference path</text>
<path d="M40 452H1160" stroke="#cfcec3"/><text x="40" y="477" class="small">Scope: known-rate RRC BPSK/QPSK amid sparse tone/chirp interference. Unassigned residual includes noise and estimation error.</text>
</svg>
